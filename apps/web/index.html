    <script>
      // Apply the saved panel theme before the first paint (dark by default). The landing at `/` is always dark.
      // Storage may be blocked: ignore it then.
      try {
        var saved = window.localStorage.getItem('rota.web.theme');
        if (location.pathname !== '/' && (saved === 'light' || saved === 'dark')) {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
